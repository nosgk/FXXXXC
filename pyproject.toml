[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoxing"
version = "3.2.1"
description = "超星学习通/超星尔雅/泛雅超星全自动无人值守完成任务点"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<4.0"
dynamic = ["dependencies"]

[project.scripts]
fxxxxc = "fxxxxc.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["api*", "fxxxxc*"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running tests",
  "integration: tests that exercise multiple modules with mocked I/O",
  "network: tests that require network access (disabled by default)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".git", ".venv", "venv", "build", "dist", "release", "docs", "gui/.dart_tool"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "fxxxxc"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "gui/", "build/", "dist/"]

[tool.coverage.run]
branch = true
source = ["api", "fxxxxc", "main"]
omit = ["tests/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
