[common]
; 使用 cookie 登录：true 时忽略账号密码，直接读取 cookies.txt
use_cookies = false

; 手机号账号（未使用 cookies 时必填）
username = xxx

; 登录密码（未使用 cookies 时必填）
password = xxx

; 要学习的课程ID列表，逗号分隔；留空则启动后交互选择。
; 注意：显式填写但没有任何匹配会直接报错退出，不会回退学习全部课程。
course_list =

; 视频播放倍速（1.0-2.0，超出会被夹取）
speed = 1

; 并发章节数（>=1）
jobs = 4

; 遇到关闭任务点时的行为: retry-重试(默认) / ask-询问 / continue-跳过
notopen_action = retry

; 任务失败/未开放章节的重试等待时间（秒）
retry_interval = 1.0

; 章节任务的最大重试次数
chapter_max_tries = 5

; 是否允许章节检测答错后自动重做（默认 false）
; 注意：仅允许作答一次的课程若开启重做，重做轮将无法获取题目
work_redo_enabled = false

; 章节检测答错后的最大重做轮数（默认 3）
work_max_retries = 3

; 是否在刷完任务点后增加章节学习次数
add_learning_count = false

; 章节学习次数目标
target_count = 100

; 每次章节学习次数访问的停留间隔（秒，默认 30 模拟前端 setInterval）
learning_count_interval = 30

[tiku]
; 可选项（大小写一致，可逗号分隔多个实现回退）:
;   TikuYanxi / TikuGo / TikuLike / TikuAdapter / TikuOcs（OCS 兼容）
;   AI（OpenAI 兼容接口）/ SiliconFlow（硅基流动）
;   TikuManual（手动输入）
provider = TikuYanxi

; 启动时是否检查大模型连接（仅 AI / SiliconFlow 生效）
check_llm_connection = true

; 是否提交答题：false 保存不提交；true 达到覆盖率后提交
submit = false

; 最低题库覆盖率（0-1）
cover_rate = 0.9

; 搜题间隔（秒）
delay = 1.0

; 题库 token，逗号分隔（言溪 / LIKE）
tokens =

; 判断题别名（逗号分隔，不要加引号/空格）
true_list = 正确,对,√,是
false_list = 错误,错,×,否,不对,不正确

; LIKE 知识库配置
likeapi_search = false
likeapi_vision = true
likeapi_model = glm-4.5-air
likeapi_retry = true
likeapi_retry_times = 3

; TikuAdapter 的接口地址
url =

; GO 题配置
go_authorization =
go_min_interval = 1.0
go_retry_times = 3
go_retry_backoff = 1.2

; AI 大模型配置（endpoint 需要兼容 OpenAI 格式，通常带 /v1）
; 以下键也可以写在每个 [tiku_bank.<id>] 实例段中，实现每个题库源独立配置
endpoint =
key =
model =
min_interval_seconds = 3
http_proxy =

; 附加到 chat.completions 请求体的额外参数（JSON 对象），会透传给 API
; 默认关闭深度思考：思考内容混入输出会导致答案解析失败，且大幅增加耗时与 token 消耗
; 所用 API 不支持该参数而报错时，可将其设为 {}；也可传其他厂商参数，如 {"enable_thinking": false}
extra_body = {"thinking": {"type": "disabled"}}

; 开启后请求附带 response_format={"type":"json_object"}，由服务端保证输出为合法 JSON，
; 可消除大模型输出解析失败的问题；部分端点/中转不支持该参数会报错，报错时请保持关闭
json_mode = false

; 硅基流动配置
siliconflow_key =
siliconflow_model = deepseek-ai/DeepSeek-R1
siliconflow_endpoint = https://api.siliconflow.cn/v1/chat/completions

; 手动模式配置
manual_mode_default = batch
; 分隔符：; / , / space / \n
manual_mode_separator = ;

; ============================================================
; 题库实例（进阶）：每个 [tiku_bank.<id>] 是一个独立的题库源，
; 拥有自己的 provider 与专属配置；enabled 的实例按 priority 升序
; 组成梯度回退链（0 最先），不同实例可用不同的 token/模型/key，
; 也因此可以多题库同时启用。
; 示例：
;   [tiku_bank.yanxi]
;   enabled = true
;   priority = 0
;   provider = TikuYanxi
;   tokens = xxx,yyy
;
;   [tiku_bank.ai]
;   enabled = true
;   priority = 1
;   provider = AI
;   endpoint = https://api.example.com/v1
;   key = sk-xxx
;   model = deepseek-chat
; TikuOcs 说明：ocs_wrappers 粘贴 ocsjs「题库配置」JSON（[{name,url,data,...}]）即可用，
; 鉴权通常已内嵌在配置里；可选 ocs_answer_path 指定答案提取点路径（如 data.answer）。
; 存在本节实例段时，上面的 [tiku] provider 仅作为未配置实例时的兼容回退。
; ============================================================

; 显式关闭 TLS 证书校验（仅信任网络环境下使用，默认 false）
insecure_skip_verify = false

[notification]
; 可选项: ServerChan / Qmsg / Bark / Telegram；留空不启用
provider =

; 通知地址（各服务的 webhook）
url =

; Telegram 的 chat_id
tg_chat_id =
