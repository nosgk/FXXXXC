name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version suffix (for example 3.2.1 or dev)"
        required: false
        default: "dev"
      create_release:
        description: "Create a GitHub Release from the built artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    environment: windows-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-engine.txt pyinstaller

      - name: Sanity compile (seconds, guards the artifact)
        run: python -m compileall -q api fxxxxc main.py

      - name: Build engine
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --noconsole --onedir `
            --name fxxxxc-engine `
            --icon gui/windows/runner/resources/app_icon.ico `
            --add-data "resource;resource" `
            --collect-submodules fxxxxc `
            --hidden-import api.captcha `
            fxxxxc/engine/__main__.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Build Flutter GUI
        working-directory: gui
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        shell: pwsh
        run: pwsh -File scripts/package_windows.ps1 -Version "${{ inputs.version }}"

      - name: Smoke test
        shell: pwsh
        run: |
          & "dist/fxxxxc-engine/fxxxxc-engine.exe" --version
          $zip = Get-ChildItem "release/*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No release zip produced" }
          Get-FileHash $zip.FullName -Algorithm SHA256 | Tee-Object -FilePath "$($zip.FullName).sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FXXXXC-windows-x64-${{ inputs.version }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-windows]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FXXXXC-windows-x64-${{ inputs.version }}
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FXXXXC v${{ inputs.version }}
          files: release/*
          generate_release_notes: true
