name: CI and Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version suffix (for example 3.2.0 or dev)"
        required: false
        default: "dev"
      build_gui:
        description: "Build the Flutter Windows GUI (requires gui/pubspec.yaml)"
        type: boolean
        default: true
      run_integration:
        description: "Run network integration tests (requires repository secrets)"
        type: boolean
        default: false
      create_release:
        description: "Create a GitHub Release from the built artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q api fxxxxc main.py scripts

      - name: Ruff (critical errors, blocking)
        run: ruff check --select E9,F63,F7,F82 api fxxxxc main.py scripts

      - name: Ruff (full report, non-blocking)
        continue-on-error: true
        run: ruff check api fxxxxc main.py scripts

      - name: Mypy (new package, non-blocking until phase 5)
        continue-on-error: true
        run: mypy fxxxxc

      - name: Bandit (non-blocking baseline)
        continue-on-error: true
        run: bandit -r fxxxxc -q

      - name: Dependency audit (non-blocking baseline)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Tests
        run: |
          pytest -q \
            --cov=api --cov=fxxxxc --cov=main \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=30

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore

  python-tests-windows:
    name: Python tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: pytest -q

  flutter-quality:
    name: Flutter quality
    if: ${{ inputs.build_gui && hashFiles('gui/pubspec.yaml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Pub get
        working-directory: gui
        run: flutter pub get

      - name: Generate code
        working-directory: gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: gui
        run: flutter analyze

      - name: Test
        working-directory: gui
        run: flutter test

  build-windows:
    name: Build Windows x64
    needs: [python-quality, python-tests-windows, flutter-quality]
    if: ${{ always() && needs.python-quality.result == 'success' && needs.python-tests-windows.result == 'success' && (needs.flutter-quality.result == 'success' || needs.flutter-quality.result == 'skipped') }}
    runs-on: windows-latest
    environment: windows-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-engine.txt -r requirements-dev.txt

      - name: Build engine
        shell: pwsh
        run: |
          if (Test-Path "fxxxxc/engine/__main__.py") {
            pyinstaller --noconfirm --clean --noconsole --onedir `
              --name fxxxxc-engine `
              --add-data "resource;resource" `
              --collect-submodules fxxxxc `
              --hidden-import api.captcha `
              fxxxxc/engine/__main__.py
          } else {
            Write-Host "Engine entrypoint not found; skipping engine build."
          }

      - uses: subosito/flutter-action@v2
        if: ${{ inputs.build_gui && hashFiles('gui/pubspec.yaml') != '' }}
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Build Flutter GUI
        if: ${{ inputs.build_gui && hashFiles('gui/pubspec.yaml') != '' }}
        working-directory: gui
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          pwsh -File scripts/package_windows.ps1 -Version "${{ inputs.version }}"

      - name: Smoke test
        shell: pwsh
        run: |
          if (Test-Path "dist/fxxxxc-engine/fxxxxc-engine.exe") {
            & "dist/fxxxxc-engine/fxxxxc-engine.exe" --version
          }
          $zip = Get-ChildItem "release/*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No release zip produced" }
          Get-FileHash $zip.FullName -Algorithm SHA256 | Tee-Object -FilePath "$($zip.FullName).sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FXXXXC-windows-x64-${{ inputs.version }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-windows]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FXXXXC-windows-x64-${{ inputs.version }}
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FXXXXC v${{ inputs.version }}
          files: release/*
          generate_release_notes: true
